<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="title desc" lang="it">
  <title id="title">Conversioni tra prefissi in entrambi i versi</title>
  <desc id="desc">In alto: da chilometri a metri e da metri a millimetri si moltiplica il numero per 1000 a ogni passaggio; nel verso inverso si moltiplica per 0,001. Esempio: 2,5 km uguale a 2500 m uguale a 2 500 000 mm. In basso: da centimetri a millimetri si moltiplica per 10, da millimetri a micrometri per 1000. Nel verso inverso i fattori sono 0,1 e 0,001. Esempio: 3,2 cm uguale a 32 mm uguale a 32 000 micrometri. Le frecce trasformano il valore numerico, conservando la lunghezza.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#174d79"/></marker>
    <style>
      text {font-family:Arial,Helvetica,sans-serif;fill:#142d41;text-anchor:middle}
      .heading {font-size:30px;font-weight:700}
      .sub {font-size:21px}
      .unit {font-size:38px;font-weight:700}
      .name {font-size:20px}
      .factor {font-size:26px;fill:#174d79;font-weight:700}
      .example {font-size:27px}
      .arrow {fill:none;stroke:#174d79;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="740" fill="#fff"/>
  <text x="480" y="43" class="heading">Cambiare unità, conservare la lunghezza</text>
  <text x="480" y="76" class="sub">I fattori sulle frecce si applicano al numero.</text>
  <text x="310" y="122" class="factor">· 1000</text>
  <text x="650" y="122" class="factor">· 1000</text>
  <path d="M 220 140 H 400" class="arrow"/>
  <path d="M 560 140 H 740" class="arrow"/>
  <text x="140" y="180" class="unit">km</text>
  <text x="480" y="180" class="unit">m</text>
  <text x="820" y="180" class="unit">mm</text>
  <text x="140" y="207" class="name">chilometri</text>
  <text x="480" y="207" class="name">metri</text>
  <text x="820" y="207" class="name">millimetri</text>
  <path d="M 400 224 H 220" class="arrow"/>
  <path d="M 740 224 H 560" class="arrow"/>
  <text x="310" y="257" class="factor">· 0,001</text>
  <text x="650" y="257" class="factor">· 0,001</text>
  <text x="480" y="307" class="example">2,5 km = 2500 m = 2 500 000 mm</text>
  <line x1="48" y1="348" x2="912" y2="348" stroke="#b7c6d2" stroke-width="2"/>
  <text x="480" y="390" class="sub">Il fattore dipende dai due prefissi.</text>
  <text x="310" y="436" class="factor">· 10</text>
  <text x="650" y="436" class="factor">· 1000</text>
  <path d="M 220 454 H 400" class="arrow"/>
  <path d="M 560 454 H 740" class="arrow"/>
  <text x="140" y="494" class="unit">cm</text>
  <text x="480" y="494" class="unit">mm</text>
  <text x="820" y="494" class="unit">µm</text>
  <text x="140" y="521" class="name">centimetri</text>
  <text x="480" y="521" class="name">millimetri</text>
  <text x="820" y="521" class="name">micrometri</text>
  <path d="M 400 538 H 220" class="arrow"/>
  <path d="M 740 538 H 560" class="arrow"/>
  <text x="310" y="571" class="factor">· 0,1</text>
  <text x="650" y="571" class="factor">· 0,001</text>
  <text x="480" y="621" class="example">3,2 cm = 32 mm = 32 000 µm</text>
  <text x="480" y="685" class="sub">Unità più piccola → numero più grande.</text>
  <text x="480" y="716" class="sub">Unità più grande → numero più piccolo.</text>
</svg>
