<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 680" role="img" aria-labelledby="titolo descrizione">
<title id="titolo">Profilo di temperatura attraverso una parete esterna</title>
<desc id="descrizione">Aria interna a 25 gradi Celsius, muro omogeneo e aria esterna a meno 5 gradi Celsius. La temperatura varia curvilineamente vicino alle superfici dal lato aria, e linearmente all'interno del muro. Il calore fluisce verso l'esterno.</desc>
