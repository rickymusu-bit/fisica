<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="titolo descrizione">
<title id="titolo">Vaporizzazione della stessa massa d’acqua</title>
<desc id="descrizione">500 kg d’acqua già a circa 100 gradi Celsius alla pressione atmosferica ordinaria assorbono Q e diventano vapore alla stessa temperatura. Si considera solo la vaporizzazione. Nessuna fotografia.</desc>
<defs><marker id="freccia" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a3421d"/></marker></defs>
<rect width="600" height="330" fill="#faf9f5"/>
<g font-family="Arial, sans-serif" fill="#163c49">
<text x="300" y="35" text-anchor="middle" font-size="26" font-weight="bold">Vaporizzazione dell’acqua</text>
<text x="300" y="69" text-anchor="middle" font-size="21">La stessa massa della scultura: 500 kg</text>
<path d="M140,90 L140,137" stroke="#a3421d" stroke-width="3" marker-end="url(#freccia)"/>
<text x="160" y="119" font-size="22" fill="#a3421d">Q assorbita</text>
<text x="140" y="175" text-anchor="middle" font-size="21" font-weight="bold">Acqua a 100 °C</text>
<path d="M252,168 L343,168" stroke="#a3421d" stroke-width="3" marker-end="url(#freccia)"/>
<text x="458" y="175" text-anchor="middle" font-size="21" font-weight="bold">Vapore a 100 °C</text>
<text x="300" y="226" text-anchor="middle" font-size="21">Pressione atmosferica ordinaria</text>
<text x="300" y="272" text-anchor="middle" font-size="19">Solo cambiamento di stato,</text>
<text x="300" y="299" text-anchor="middle" font-size="19">senza dispersioni né riscaldamento preliminare.</text>
</g></svg>