name: Sincronizzazione una tantum template Stringhe

on:
  push:
    branches:
      - 'fix/cap9-punti-zoom-tabelle-20261025'
    paths:
      - '.github/workflows/sync-template-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sincronizza componenti canonici
        run: |
          python3 scripts/sync_stringhe_theme.py
          python3 scripts/sync_stringhe_theme.py --check
          git diff --check
          git status --short
      - name: Commit su ramo di bozza
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add riferimenti/TEMA_DISPENSE.html lavorazione/sito/anteprima-bordi-stringhe.html crediti.html
          if ! git diff --cached --quiet; then
            git commit -m "Sincronizza il modello Stringhe con lo stile aggiornato"
            git push origin HEAD:fix/cap9-punti-zoom-tabelle-20261025
          fi
