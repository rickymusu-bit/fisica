name: Pubblica Praticamente la Fisica

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'pubblicazione.json'
      - '*.html'
      - 'scripts/build_pages.py'
      - 'scripts/home_covers.py'
      - 'scripts/home_languages.py'
      - 'scripts/home_italian.py'
      - 'lingue/**'
      - 'copertine/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepara gli articoli, le lingue e le copertine
        run: python3 scripts/build_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
