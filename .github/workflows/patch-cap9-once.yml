name: Correzione una tantum punti parabola capitolo 9

on:
  push:
    branches:
      - 'fix/cap9-punti-zoom-tabelle-20261025'
    paths:
      - '.github/workflows/patch-cap9-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggiorna solo i due HTML del capitolo 9
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = (
              Path('relazioni_proporzionalita_it.html'),
              Path('lavorazione/proporzionalita_diretta/bozza.html'),
          )
          def replace_one(text, old, new):
              count = text.count(old)
              assert count == 1, (old[:80], count)
              return text.replace(old, new, 1)

          for path in paths:
              text = path.read_text(encoding='utf-8')
              text = replace_one(text, '<meta name="version" content="v4">', '<meta name="version" content="v5">')
              text = replace_one(
                  text,
                  '<meta name="date" content="2026-10-25T00:48:48+02:00">',
                  '<meta name="date" content="2026-10-25T01:23:00+02:00">'
              )
              text = replace_one(text, 'Versione v4 — 25 ottobre 2026', 'Versione v5 — 25 ottobre 2026')

              index = text.index('data-plot="quadratic"')
              start = text.rfind('<svg ', 0, index)
              end = text.index('</svg>', index) + len('</svg>')
              svg = text[start:end]
              assert svg.count('data-point-x=') == 0
              svg = replace_one(
                  svg, 'aria-label="Coppie rappresentate: ."',
                  'aria-label="Coppie rappresentate: (0; 0), (1; 1), (2; 4), (3; 9), (4; 16)."'
              )
              points = ''.join(
                  '<circle class="dot" data-point-x="{}" cx="{}" cy="{}" r="5"/>'.format(
                      i, 50 + 325 * i / 4, 245 - 215 * (i * i) / 32
                  )
                  for i in range(5)
              )
              svg = replace_one(svg, '</svg>', points + '</svg>')
              assert svg.count('data-point-x=') == 5
              text = text[:start] + svg + text[end:]
              assert text.count('data-model="quadratic"') == 1
              path.write_text(text, encoding='utf-8')
              print(path, '5 punti, v5,', path.stat().st_size, 'byte')
          PY
      - name: Controlla e salva sul ramo della PR
        shell: bash
        run: |
          git diff --check
          git diff --numstat -- relazioni_proporzionalita_it.html lavorazione/proporzionalita_diretta/bozza.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relazioni_proporzionalita_it.html lavorazione/proporzionalita_diretta/bozza.html
          git commit -m "Capitolo 9 v5: aggiungi cinque punti alla parabola interattiva"
          git push origin HEAD:fix/cap9-punti-zoom-tabelle-20261025
