name: Pulizia una tantum dei branch già integrati

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-merged-branches-once.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Elimina esclusivamente i branch interamente inclusi in main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/cleanup_merged_branches.py
# Esecuzione corretta: verifica la punta mediante GET branch prima della DELETE.
