name: Inventario metadati e tabelle (temporaneo)
on:
  push:
    branches: [fix/audit-allineamento-tabelle-capitoli-20261025]
    paths: [.github/workflows/metadati-tabelle-temporaneo.yml]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-allineamento-tabelle-capitoli-20261025
      - name: Elenca versioni, date, copie di lavorazione e contenitori delle tabelle
        run: |
          python3 - <<'PY'
          import json, re, html, hashlib
          from pathlib import Path
          pub=json.loads(Path('pubblicazione.json').read_text())['articoli']
          rows=[]
          for name in pub:
              s=Path(name).read_text(encoding='utf-8')
              tables=list(re.finditer(r'<table\b[^>]*>[\s\S]*?</table>',s,re.I))
              if not tables: continue
              ver=re.findall(r'<meta\s+name=["\x27]version["\x27]\s+content=["\x27]([^"\x27]+)',s,re.I)
              dates=re.findall(r'<meta\s+name=["\x27]date["\x27]\s+content=["\x27]([^"\x27]+)',s,re.I)
              foot=re.findall(r'<footer\b[^>]*>[\s\S]*?</footer>',s,re.I)
              foot=[re.sub(r'<[^>]+>',' ',x)[-450:].strip() for x in foot]
              other=re.findall(r'\b(?:Versione|versione|v)\s*v?\d+(?:\.\d+)?',s[-22000:])
              stem=name.removesuffix('.html').removesuffix('_it')
              candidates=[Path('lavorazione')/stem/'bozza.html']
              match=[dict(path=str(p),identical=p.read_bytes()==s.encode('utf-8'),
                    tableCount=len(re.findall(r'<table\b',p.read_text(encoding='utf-8'),re.I)))
                    for p in candidates if p.exists()]
              info=[]
              for j,t in enumerate(tables):
                  earlier=s[max(0,t.start()-260):t.start()]
                  info.append(dict(i=j+1,prior=re.sub(r'\s+',' ',earlier[-260:]),opening=t.group(0).split('>')[0][:220],
                       closeAfter=s[t.end():t.end()+140]))
              rows.append(dict(file=name,versions=ver,dates=dates,footer=foot[-2:],other=other[-5:],drafts=match,tables=info))
          print('META_START')
          print(json.dumps(rows,ensure_ascii=False))
          print('META_END')
          PY

      - name: Valuta celle discorsive e numeriche per colonna
        run: |
          python3 - <<'PY'
          import re, html, json
          from pathlib import Path
          subset=['cifre_significative_it.html','errori_incertezza_misura_it.html','stati_della_materia.html','passaggi_di_stato.html','strumenti_misura_it.html','potenze_dieci_notazione_scientifica_it.html']
          for file in subset:
              s=Path(file).read_text()
              print('FILE',file)
              for idx,table in enumerate(re.findall(r'<table\b[^>]*>[\s\S]*?</table>',s,re.I),1):
                  print(' TABLE',idx)
                  for r,row in enumerate(re.findall(r'<tr\b[^>]*>[\s\S]*?</tr>',table,re.I)[:9]):
                      cells=re.findall(r'<(?:th|td)\b[^>]*>([\s\S]*?)</(?:th|td)>',row,re.I)
                      texts=[' '.join(html.unescape(re.sub(r'<[^>]*>',' ',item)).split())[:145] for item in cells]
                      print('  ',r,texts)
          PY

      - name: Confronta integralmente i contenuti con main
        run: |
          git fetch --depth=1 origin main
          python3 - <<'PY'
          import re, subprocess,json
          from pathlib import Path
          pub=json.loads(Path("pubblicazione.json").read_text())["articoli"]
          affected=[
          "metodo_scientifico_it.html","grandezze_fisiche_sistema_internazionale_it.html",
          "potenze_dieci_notazione_scientifica_it.html","prefissi_sistema_internazionale_it.html",
          "cifre_significative_it.html","strumenti_misura_it.html","errori_incertezza_misura_it.html",
          "temperatura_equilibrio_termico_it.html","energia_interna_calore_specifico_it.html",
          "dilatazione_termica_it.html","stati_della_materia.html","passaggi_di_stato.html",
          "conduzione_it.html"]
          assert len(pub)==19 and len(affected)==13
          def normal(s):
              s=re.sub(r'<style data-table-alignment="2026-10">[\s\S]*?</style>','',s)
              s=re.sub(r'<meta\s+name="version"\s+content="v\d+">','',s)
              s=re.sub(r'Versione\s+v\d+\b','Versione <numero versione>',s)
              s=re.sub(r' data-align-prose="(?:reason|after-first|row-labels)"','',s)
              s=re.sub(r' data-align-kind="latent"','',s)
              s=s.replace(' style="text-align: right;"','')
              return s
          for path in pub:
              before=subprocess.check_output(["git","show","origin/main:"+path]).decode("utf-8")
              after=Path(path).read_text(encoding="utf-8")
              if path not in affected:
                  assert before==after,"Capitolo senza correzioni toccato: "+path
              else:
                  if normal(before)!=normal(after):
                      i=next((i for i,(x,y) in enumerate(zip(normal(before),normal(after))) if x!=y),min(len(normal(before)),len(normal(after))))
                      raise AssertionError("Contenuto inatteso in "+path+" alla posizione "+str(i)+
                                           " "+repr(normal(before)[i-100:i+100])+" | "+repr(normal(after)[i-100:i+100]))
                  assert 'data-table-alignment="2026-10"' in after
                  print("UNCHANGED CONTENT:",path)
          print("CHECK PASSED: 13 capitoli solo CSS/metadati; 6 capitoli non modificati")
          
          PY
