name: Ricognizione tabelle Stringhe (temporanea)
on:
  push:
    branches: [fix/audit-allineamento-tabelle-capitoli-20261025]
    paths: [.github/workflows/audit-tabelle-temporaneo.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-allineamento-tabelle-capitoli-20261025
      - name: Analizza tabelle di tutti i capitoli pubblicati
        run: |
          python3 - <<'PY'
          import re, json
          from pathlib import Path
          from html import unescape
          root=Path('.')
          pub=json.loads((root/'pubblicazione.json').read_text())['articoli']
          report=[]
          for name in pub:
              source=(root/name).read_text(encoding='utf-8')
              tables=re.findall(r'<table\b[^>]*>[\s\S]*?</table>',source,re.I)
              all_styles='\n'.join(re.findall(r'<style\b[^>]*>([\s\S]*?)</style>',source,re.I))
              cssrules=[]
              for selector,rule in re.findall(r'([^{}]+)\{([^{}]+)\}',all_styles):
                  if re.search(r'text-align\s*:',rule,re.I) and re.search(r'(?:table|\bth\b|\btd\b|\.data-|\.measure-|\.si-|\.comparison-)',selector,re.I):
                      cssrules.append(' '.join((selector.strip()+' {'+rule.strip()+'}').split())[:360])
              details=[]
              for j,t in enumerate(tables):
                  tag=re.match(r'<table\b[^>]*>',t,re.I).group(0)
                  cells=re.findall(r'<(th|td)\b([^>]*)>([\s\S]*?)</\1>',t,re.I)
                  rows=re.findall(r'<tr\b[^>]*>',t,re.I)
                  counts={}
                  examples=[]
                  for typ,attrs,inner in cells:
                      att=' '.join(attrs.split())[:220]
                      key=(typ.lower(), re.search(r'\b(?:style|align)\s*=\s*(?:"[^"]*"|\x27[^\x27]*\x27)',att,re.I).group(0) if re.search(r'\b(?:style|align)\s*=\s*(?:"[^"]*"|\x27[^\x27]*\x27)',att,re.I) else 'default')
                      counts[str(key)]=counts.get(str(key),0)+1
                      if len(examples)<6:
                          text=unescape(re.sub(r'<[^>]+>',' ',inner))
                          text=' '.join(text.split())[:80]
                          examples.append(dict(type=typ,txt=text,attr=att))
                  details.append(dict(index=j+1,tableTag=tag[:280],cells=len(cells),rows=len(rows),cellStyles=counts,examples=examples))
              report.append(dict(chapter=name,tableCount=len(tables),tables=details,cssRules=cssrules[:22]))
          print('AUDIT_START')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          print('AUDIT_END')
          print('SUMMARY',json.dumps({'chapters':len(pub),'tables':sum(x['tableCount'] for x in report),'chaptersWithTables':[x['chapter'] for x in report if x['tableCount']]},ensure_ascii=False))
          PY

      - name: Installa Playwright e Chromium
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Misura allineamenti reali desktop e mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          from collections import Counter
          from playwright.sync_api import sync_playwright
          pub=json.loads(Path('pubblicazione.json').read_text())['articoli']
          results=[]
          js='''() => [...document.querySelectorAll('table')].map((table,i)=>{
              const cells=[...table.querySelectorAll('th,td')];
              const data=cells.map((c,j)=>({i:j,tag:c.tagName,align:getComputedStyle(c).textAlign,txt:c.textContent.trim().replace(/\\s+/g,' ').slice(0,65),classes:c.className}));
              const count={};data.forEach(c=>count[c.align]=(count[c.align]||0)+1);
              return {i:i+1,classes:table.className,counts:count,cells:data.filter(c=>c.align!=='center').slice(0,12),total:data.length}
          })'''
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True,args=['--no-sandbox'])
              for name in pub:
                  for width in (390,1280):
                      page=browser.new_page(viewport={'width':width,'height':780})
                      try:
                          page.goto((Path.cwd()/name).as_uri(),wait_until='domcontentloaded',timeout=25000)
                          a=page.evaluate(js)
                          results.append({'file':name,'width':width,'tables':a})
                      except Exception as exc:
                          results.append({'file':name,'width':width,'error':str(exc)[:260]})
                      finally: page.close()
              browser.close()
          print('BROWSER_AUDIT_START')
          print(json.dumps(results,ensure_ascii=False))
          print('BROWSER_AUDIT_END')
          PY

# Audit post-correzione: verifica stili calcolati e confronto con i risultati iniziali.
