name: Scarta ramo vecchio tema Irraggiamento (una tantum)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discard-legacy-theme-once.yml'
permissions:
  contents: write
jobs:
  discard:
    runs-on: ubuntu-latest
    steps:
      - name: Elimina solo il branch obsoleto espressamente autorizzato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target="istruzioni/tema-mac"
          expected="cc7ab4aad36c88e4fda6ee1ad59208cfd88bca36"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${target}" --jq '.object.sha')"
          test "$current" = "$expected"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${target}"
          echo "Eliminato $target al commit $current"
