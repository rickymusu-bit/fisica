name: Verifica portale Stringhe

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'index.html'
      - 'pubblicazione.json'
      - '*.html'
      - 'copertine/**'
      - '.github/workflows/test-stringhe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica generazione portale
        run: |
          python3 scripts/build_pages.py
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json
          root = Path('_site')
          for name in ('index.html', 'articoli.html', 'quiz.html'):
              assert (root / name).is_file(), name
              text = (root / name).read_text()
              assert 'Stringhe' in text
              assert 'L’essenziale della Fisica' in text
          publication = json.loads(Path('pubblicazione.json').read_text())
          home = (root / 'index.html').read_text()
          for x in publication['articoli']:
              text = (root / x).read_text()
              assert '⌂ Home' in text, x
              assert '↓ Scarica' in text, x
              assert 'string-lang' in text, x
          for x in publication['esclusi_da_pubblicazione_e_aggiornamenti']:
              assert not (root / x).exists(), x
          assert 'random-article' in home
          print('Verifica Stringhe superata')
          PY
