name: Verifica portale Stringhe

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'quiz/**'
      - 'index.html'
      - 'pubblicazione.json'
      - '*.html'
      - 'copertine/**'
      - 'identita/**'
      - 'riferimenti/**'
      - 'risorse/**'
      - '.github/workflows/test-stringhe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifica componenti e crediti
        run: |
          python3 scripts/sync_stringhe_theme.py --check
          python3 scripts/credits.py --check
      - name: Verifica build e isolamento dei contenuti
        run: |
          python3 scripts/build_pages.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Prepara Chromium per i controlli desktop e mobile
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Verifica interazioni, temi, file offline e viewport
        env:
          CHROMIUM_PATH: ''
        run: python3 scripts/verify_stringhe_browser.py
      - name: Verifica l'archivio reale di Termologia su desktop e mobile
        run: python3 scripts/verify_quiz_browser.py --real-only
      - name: Verifica pedici e apici, salvataggi precedenti e testo sicuro
        run: python3 scripts/verify_quiz_notation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: confronti-stringhe
          path: |
            lavorazione/sito/schermate/
            lavorazione/sito/verifica-stringhe.json
            lavorazione/quiz/termologia/anteprima/
            lavorazione/quiz/termologia/verifica-integrazione.json
            lavorazione/quiz/termologia/notazione/
