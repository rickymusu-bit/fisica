<title id="logo-title">Materia Oscura · Onda progressiva</title>
<desc id="logo-desc">Una sinusoide con quattro creste che viaggiano in senso orario lungo una curva chiusa. Tratto nero su fondo trasparente, ampiezza costante.</desc>
